# This is the main list of all possible loot.
# Use tags to control where and how items spawn.
#
# Format:
# - "ITEM_NAME {NBT_DATA} #b:biomes #r:rarities #a:amount #c:chance #PE:effects"
#
# Tags:
# #b (biomes): Comma-separated list of biomes (e.g., #b:plains,forest). Use '#b:all' for all biomes. (Default: all)
# #r (rarities): Comma-separated list of rarities (e.g., #r:rare,epic). Use '#r:all' for all rarities. (Default: all)
# #a (amount): A number or a range (e.g., #a:5 or #a:1-10). (Default: 1)
# #c (chance): A float from 0.0 to 1.0 for the chance of this item to be picked. (Default: 1.0)
# #PE (potion effects): Comma-separated list of 'effect_amplifier_duration'. Amplifier is 0-indexed (0=level 1).
#
# Examples:
# - "COAL #r:normal #a:8-16"
# - "SADDLE #b:plains,savanna #r:rare #c:0.5"
# - "SPLASH_POTION #r:mythic #PE:weakness_0_90,slowness_1_60"

loot-pool:
  # Normal
  - "COAL #r:normal #a:8-16"
  - "RAW_IRON #r:normal #a:4-8"
  - "WHEAT #r:normal #a:10-20"
  - "WHEAT_SEEDS #b:plains,forest #r:normal #a:10-20"
  - "PUMPKIN_SEEDS #b:plains,jungle #r:normal #a:5-10"
  - "LEATHER #b:plains #r:normal #a:2-5"

  # Rare
  - "IRON_INGOT #r:rare #a:5-10"
  - "GOLD_INGOT #r:rare #a:3-6"
  - "LAPIS_LAZULI #r:rare #a:10-30"
  - "SADDLE #b:plains,savanna #r:rare #c:0.3"
  - "IRON_HORSE_ARMOR #b:plains,savanna #r:rare #c:0.2"

  # Epic
  - "DIAMOND #r:epic #a:2-4"
  - "EMERALD #r:epic #a:2-4"
  - "GOLDEN_APPLE #r:epic"

  # Legendary
  - "DIAMOND_BLOCK #r:legendary #a:1-2"
  - "ENCHANTED_GOLDEN_APPLE #r:legendary"
  - "BOOK {StoredEnchantments:[{id:\"mending\",lvl:1s}]} #r:legendary"

  # Mythic
  - "NETHERITE_INGOT #r:mythic #c:0.1"
  - "DIAMOND_SWORD {display:{Name:'{\"text\":\"Mythic Blade\",\"color\":\"light_purple\"}'},Enchantments:[{id:\"sharpness\",lvl:7s},{id:\"unbreaking\",lvl:4s}]} #r:mythic"
  - "SPLASH_POTION #r:mythic #PE:regeneration_1_22,speed_2_90,strength_1_90"
  - "ELYTRA {Enchantments:[{id:\"unbreaking\",lvl:5s}]} #r:mythic #c:0.2"
