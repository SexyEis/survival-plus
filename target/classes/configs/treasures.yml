# Treasures Module Settings

global-settings:
  # Chance to find a treasure chest when mining any block (e.g., 0.001 for 0.1%).
  spawn-chance: 0.001
  # Cooldown in seconds before a player can find another chest.
  find-cooldown: 60
  # Time in seconds before a treasure chest despawns.
  despawn-timer: 20
  # Whether to broadcast treasure sounds to the entire server. If false, only the finder will hear it.
  broadcast-sound: false

# Message settings for when a treasure is found.
# Options for each rarity: "none", "player" (only to the finder), "server" (to everyone).
message-settings:
  normal: "player"
  rare: "player"
  epic: "server"
  legendary: "server"
  mythic: "server"

# The chance for each rarity to be chosen. The values should ideally add up to 1.0.
rarity-chances:
  normal: 0.50
  rare: 0.25
  epic: 0.15
  legendary: 0.08
  mythic: 0.02

