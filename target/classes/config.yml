# SurvivalPlus Configuration

# A list of command aliases for the base command.
# The main command is /survivalplus
# Default: [sp]
command-aliases:
  - sp

modules:
  # Enable or disable the join/quit message module.
  # This module will suppress the join and quit messages when enabled.
  join-quit-message:
    enabled: true
  vein-miner:
    enabled: true
    # The maximum number of blocks that can be mined at once.
    max-blocks: 64
    # The list of blocks that can be vein-mined.
    mineable-ores:
      - "COAL_ORE"
      - "DEEPSLATE_COAL_ORE"
      - "COPPER_ORE"
      - "DEEPSLATE_COPPER_ORE"
      - "IRON_ORE"
      - "DEEPSLATE_IRON_ORE"
      - "GOLD_ORE"
      - "DEEPSLATE_GOLD_ORE"
      - "LAPIS_ORE"
      - "DEEPSLATE_LAPIS_ORE"
      - "REDSTONE_ORE"
      - "DEEPSLATE_REDSTONE_ORE"
      - "DIAMOND_ORE"
      - "DEEPSLATE_DIAMOND_ORE"
      - "EMERALD_ORE"
      - "DEEPSLATE_EMERALD_ORE"
      - "NETHER_GOLD_ORE"
      - "NETHER_QUARTZ_ORE"
  tool-storage:
    enabled: true
  ultimine:
    enabled: true
    # The maximum number of blocks that can be broken at once by the ultimine module.
    max-blocks: 64
  timber:
    enabled: true
    # The maximum number of logs that can be chopped at once.
    max-logs: 512
    # The radius to search for leaves around logs.
    leaf-search-radius: 10
    # The list of blocks considered logs.
    log-types:
      - "ACACIA_LOG"
      - "BIRCH_LOG"
      - "DARK_OAK_LOG"
      - "JUNGLE_LOG"
      - "OAK_LOG"
      - "SPRUCE_LOG"
      - "MANGROVE_LOG"
      - "CHERRY_LOG"
      - "STRIPPED_ACACIA_LOG"
      - "STRIPPED_BIRCH_LOG"
      - "STRIPPED_DARK_OAK_LOG"
      - "STRIPPED_JUNGLE_LOG"
      - "STRIPPED_OAK_LOG"
      - "STRIPPED_SPRUCE_LOG"
      - "STRIPPED_MANGROVE_LOG"
      - "STRIPPED_CHERRY_LOG"
      - "CRIMSON_STEM"
      - "WARPED_STEM"
      - "STRIPPED_CRIMSON_STEM"
      - "STRIPPED_WARPED_STEM"
    # The list of blocks considered leaves.
    leaf-types:
      - "ACACIA_LEAVES"
      - "BIRCH_LEAVES"
      - "DARK_OAK_LEAVES"
      - "JUNGLE_LEAVES"
      - "OAK_LEAVES"
      - "SPRUCE_LEAVES"
      - "MANGROVE_LEAVES"
      - "CHERRY_LEAVES"
      - "AZALEA_LEAVES"
      - "FLOWERING_AZALEA_LEAVES"
      - "NETHER_WART_BLOCK"
      - "WARPED_WART_BLOCK"
      - "SHROOMLIGHT"
  anticooldown:
    enabled: true
  treasures:
    enabled: true
    global-settings:
      # Chance to find a treasure chest when mining any block (e.g., 0.001 for 0.1%).
      spawn-chance: 0.001
      # Cooldown in seconds before a player can find another chest.
      find-cooldown: 60
    # The chance for each rarity to be chosen. The values should ideally add up to 1.0.
    rarity-chances:
      normal: 0.50
      rare: 0.25
      epic: 0.15
      legendary: 0.08
      mythic: 0.02
    # Loot tables for the treasures.
    # You can define loot for any biome. If a biome is not specified, 'default' will be used.
    # Format: 'MATERIAL_NAME QUANTITY_RANGE {NBT_DATA}'
    # Example: 'DIAMOND_SWORD 1 {Enchantments:[{id:"sharpness",lvl:10s}]}'
    loot-tables:
      default:
        normal:
          - "COAL 8-16"
          - "RAW_IRON 4-8"
          - "WHEAT 10-20"
        rare:
          - "IRON_INGOT 5-10"
          - "GOLD_INGOT 3-6"
          - "LAPIS_LAZULI 10-30"
        epic:
          - "DIAMOND 2-4"
          - "EMERALD 2-4"
          - "GOLDEN_APPLE 1"
        legendary:
          - "DIAMOND_BLOCK 1-2"
          - "ENCHANTED_GOLDEN_APPLE 1"
          - "BOOK 1 {StoredEnchantments:[{id:\"mending\",lvl:1s}]}"
        mythic:
          - "NETHERITE_INGOT 1"
          - "DIAMOND_SWORD 1 {display:{Name:'{\"text\":\"Mythic Blade\",\"color\":\"light_purple\"}'},Enchantments:[{id:\"sharpness\",lvl:7s},{id:\"unbreaking\",lvl:4s}]}"
          - "ELYTRA 1 {Enchantments:[{id:\"unbreaking\",lvl:5s}]}"
      plains:
        normal:
          - "WHEAT_SEEDS 10-20"
          - "PUMPKIN_SEEDS 5-10"
          - "LEATHER 2-5"
        rare:
          - "SADDLE 1"
          - "IRON_HORSE_ARMOR 1"
